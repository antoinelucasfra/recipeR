name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libssh2-1-dev

      - name: Restore renv library
        uses: r-lib/actions/setup-renv@v2

      - name: Run tests
        run: devtools::test()
        shell: Rscript {0}

      - name: Check R formatting (air)
        run: air --check .
        continue-on-error: true

      - name: Run linter (lintr)
        run: |
          lints <- lintr::lint_dir("R")
          print(lints)
          if (length(lints) > 0) stop("Linting issues found")
        shell: Rscript {0}
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/
