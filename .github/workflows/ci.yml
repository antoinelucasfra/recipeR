name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libssh2-1-dev

      - name: Install required packages
        run: |
          Rscript -e "
          # Install renv
          install.packages('renv')
          # Initialize renv with the lockfile
          library(renv)
          renv::init()
          # Copy lockfile to renv/etc/
          sys.copy1 <- Sys.glob('renv/library/linux-ubuntu-noble/R-4.6/x86_64-pc-linux-gnu')
          if (length(sys.copy1) > 0) {
            file.copy(sys.copy1, 'renv/library', recursive = TRUE)
          }
          # Run tests
          install.packages(c('devtools', 'testthat'), repos = Sys.getenv('RSPM'), type = 'binary')
          devtools::test()
          "
