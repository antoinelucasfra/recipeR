name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libssh2-1-dev
          sudo apt-get install -y libgdal-dev libproj-dev libgeos-dev

      - name: Install required packages
        run: |
          Rscript -e "
          # Install renv
          install.packages('renv', repos = Sys.getenv('RSPM'), type = 'binary')
          # Restore packages from lockfile
          library(renv)
          renv::restore(confirm = FALSE)
          # Install test dependencies
          install.packages(c('devtools', 'testthat'), repos = Sys.getenv('RSPM'), type = 'binary')
          # Run tests
          devtools::test()
          "
